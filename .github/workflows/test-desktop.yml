name: QVAC Desktop Tests

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Working directory for tests'
        required: false
        type: string
        default: '.'
      platforms:
        description: 'JSON array of runner labels (e.g., ["ubuntu-latest"] or ["ai-run-linux-gpu", "macos-latest-xlarge"])'
        required: true
        type: string
      consumer-timeout:
        description: 'Timeout in seconds for consumer connection'
        required: false
        type: number
        default: 30
    secrets:
      PAT_TOKEN:
        required: true
      NPM_TOKEN:
        required: true
      MQTT_PROTOCOL:
        required: true
      MQTT_HOST:
        required: true
      MQTT_PORT:
        required: true
      MQTT_USERNAME:
        required: true
      MQTT_PASSWORD:
        required: true
      MQTT_CA_CERT:
        required: false
      MQTT_CLIENT_CERT:
        required: false
      MQTT_CLIENT_KEY:
        required: false

jobs:
  build:
    # Windows builds directly on test runner (skip cache due to native addon issues)
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-latest
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configure npm registries
        shell: node {0}
        run: |
          const { execSync } = require('child_process');
          const fs = require('fs');

          if (!process.env.NPM_TOKEN) { console.log('❌ NPM_TOKEN is empty'); process.exit(1); }
          if (!process.env.PAT_TOKEN) { console.log('❌ PAT_TOKEN is empty'); process.exit(1); }

          // Create .npmrc file in repository root for both npm and bun
          const lines = [
            'registry=https://registry.npmjs.org/',
            '@qvac:registry=https://registry.npmjs.org/',
            '@tetherto:registry=https://npm.pkg.github.com/',
            `//registry.npmjs.org/:_authToken=${process.env.NPM_TOKEN}`,
            `//npm.pkg.github.com/:_authToken=${process.env.PAT_TOKEN}`
          ];
          fs.writeFileSync('.npmrc', lines.join('\n'), 'utf8');
          console.log('✅ .npmrc configured');

          console.log('Testing @qvac/sdk access...');
          try {
            execSync('npm info @qvac/sdk', { stdio: 'pipe' });
            console.log('✅ @qvac/sdk accessible');
          } catch (err) {
            console.log('❌ Cannot access @qvac/sdk - retrying with verbose output...');
            execSync('npm info @qvac/sdk --loglevel=verbose', { stdio: 'inherit' });
            process.exit(1);
          }

          console.log('Testing @tetherto/qvac-test-suite access...');
          try {
            execSync('npm info @tetherto/qvac-test-suite', { stdio: 'pipe' });
            console.log('✅ @tetherto/qvac-test-suite accessible');
          } catch (err) {
            console.log('❌ Cannot access @tetherto/qvac-test-suite - retrying with verbose output...');
            execSync('npm info @tetherto/qvac-test-suite --loglevel=verbose', { stdio: 'inherit' });
            process.exit(1);
          }
          console.log('✅ All registries validated');

      - name: Install dependencies (root directory)
        run: bun install

      - name: Build project (root directory)
        shell: node {0}
        run: |
          const { execSync } = require('child_process');
          const fs = require('fs');

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (packageJson.scripts && packageJson.scripts.build) {
            console.log('Building root project...');
            execSync('bun run build', { stdio: 'inherit' });
          } else {
            console.log('⚠️  No build script found in root package.json - skipping');
          }

      - name: Copy .npmrc to consumer directory
        shell: node {0}
        run: |
          const fs = require('fs');
          const path = require('path');
          const npmrcContent = fs.readFileSync('.npmrc', 'utf8');
          const consumerDir = '${{ inputs.working-directory }}';
          fs.writeFileSync(path.join(consumerDir, '.npmrc'), npmrcContent, 'utf8');
          console.log('✅ .npmrc copied to consumer directory');

      - name: Install dependencies (consumer directory)
        working-directory: ${{ inputs.working-directory }}
        run: npm install --install-links

      - name: Build project (consumer directory)
        working-directory: ${{ inputs.working-directory }}
        run: bun run build

      - name: Cache build outputs
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ inputs.working-directory }}/dist
            ${{ inputs.working-directory }}/build
            ${{ inputs.working-directory }}/node_modules
          key: build-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          enableCrossOsArchive: true

  test-desktop:
    needs: build
    strategy:
      matrix:
        os: ${{ fromJSON(inputs.platforms) }}
      fail-fast: false
    runs-on: ${{ matrix.os }}
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      MQTT_PROTOCOL: ${{ secrets.MQTT_PROTOCOL }}
      MQTT_HOST: ${{ secrets.MQTT_HOST }}
      MQTT_PORT: ${{ secrets.MQTT_PORT }}
      MQTT_USERNAME: ${{ secrets.MQTT_USERNAME }}
      MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Determine platform and arch
        id: platform
        shell: node {0}
        run: |
          const fs = require('fs');
          const os = require('os');

          const platform = os.platform();
          const arch = os.arch();

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `platform=${platform}\n`, 'utf8');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `arch=${arch}\n`, 'utf8');
          console.log(`Platform: ${platform}, Arch: ${arch}`);

      # --- Non-Windows: Restore from cache ---
      - name: Restore build cache
        if: runner.os != 'Windows'
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ inputs.working-directory }}/dist
            ${{ inputs.working-directory }}/build
            ${{ inputs.working-directory }}/node_modules
          key: build-${{ steps.platform.outputs.platform }}-${{ steps.platform.outputs.arch }}-${{ github.sha }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      # --- Windows: Full build directly on runner ---
      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1.4.0

      - name: Check/Install DirectML (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Write-Host "=== Windows Version ==="
          [System.Environment]::OSVersion.Version

          Write-Host "`n=== Checking for existing DirectML.dll ==="
          $systemDml = "C:\Windows\System32\DirectML.dll"
          if (Test-Path $systemDml) {
            $ver = (Get-Item $systemDml).VersionInfo
            Write-Host "✅ Found: $systemDml"
            Write-Host "   Version: $($ver.FileVersion)"
            Write-Host "   Size: $((Get-Item $systemDml).Length) bytes"
          } else {
            Write-Host "❌ DirectML.dll NOT in System32"

            # Search common locations
            Write-Host "`n=== Searching for DirectML.dll ==="
            $found = Get-ChildItem -Path "C:\Windows" -Recurse -Filter "directml.dll" -ErrorAction SilentlyContinue | Select-Object -First 5
            if ($found) {
              $found | ForEach-Object { Write-Host "Found: $($_.FullName)" }
            } else {
              Write-Host "Not found anywhere in C:\Windows"
            }

            # Install from NuGet
            Write-Host "`n=== Installing DirectML from NuGet ==="
            nuget install Microsoft.AI.DirectML -OutputDirectory $env:TEMP\directml -Version 1.15.1

            $dmlPath = Get-ChildItem -Path "$env:TEMP\directml" -Recurse -Filter "DirectML.dll" | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
            if ($dmlPath) {
              Write-Host "Found in NuGet: $($dmlPath.FullName)"
              Copy-Item $dmlPath.FullName -Destination "C:\Windows\System32\DirectML.dll" -Force
              Write-Host "✅ DirectML.dll installed to System32"
            } else {
              Write-Host "❌ Failed to find DirectML.dll in NuGet package"
              Get-ChildItem -Path "$env:TEMP\directml" -Recurse -Filter "*.dll" | ForEach-Object { Write-Host $_.FullName }
            }
          }

      - name: Debug - Vulkan diagnostics (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          echo === Vulkan SDK environment ===
          echo VULKAN_SDK=%VULKAN_SDK%
          echo.
          echo === vulkaninfoSDK ===
          "%VULKAN_SDK%\Bin\vulkaninfoSDK.exe" --summary 2>&1 || echo vulkaninfoSDK failed
          echo.
          echo === Available Vulkan layers ===
          dir "%VULKAN_SDK%\Bin\*.dll" 2>nul || echo No DLLs in Vulkan SDK Bin

      - name: List global npm packages (Windows)
        if: runner.os == 'Windows'
        run: npm list -g --depth=0

      - name: Configure npm registries (Windows)
        if: runner.os == 'Windows'
        shell: node {0}
        run: |
          const { execSync } = require('child_process');
          const fs = require('fs');

          if (!process.env.NPM_TOKEN) { console.log('❌ NPM_TOKEN is empty'); process.exit(1); }
          if (!process.env.PAT_TOKEN) { console.log('❌ PAT_TOKEN is empty'); process.exit(1); }

          const lines = [
            'registry=https://registry.npmjs.org/',
            '@qvac:registry=https://registry.npmjs.org/',
            '@tetherto:registry=https://npm.pkg.github.com/',
            `//registry.npmjs.org/:_authToken=${process.env.NPM_TOKEN}`,
            `//npm.pkg.github.com/:_authToken=${process.env.PAT_TOKEN}`
          ];
          fs.writeFileSync('.npmrc', lines.join('\n'), 'utf8');
          console.log('✅ .npmrc configured');

      - name: Install dependencies - root (Windows)
        if: runner.os == 'Windows'
        run: bun install

      - name: Build project - root (Windows)
        if: runner.os == 'Windows'
        shell: node {0}
        run: |
          const { execSync } = require('child_process');
          const fs = require('fs');

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (packageJson.scripts && packageJson.scripts.build) {
            console.log('Building root project...');
            execSync('bun run build', { stdio: 'inherit' });
          } else {
            console.log('⚠️  No build script found in root package.json - skipping');
          }

      - name: Debug - Check VC++ Redistributables (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Write-Host "=== Installed VC++ Redistributables ==="
          Get-ItemProperty HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*,
                           HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\* |
            Where-Object { $_.DisplayName -like "*Visual C++*" -or $_.DisplayName -like "*Microsoft Visual C++*" } |
            Select-Object DisplayName, DisplayVersion |
            Format-Table -AutoSize

      - name: Debug - Inspect native addon (Windows)
        if: runner.os == 'Windows'
        shell: node {0}
        run: |
          const { execSync } = require('child_process');
          const fs = require('fs');
          const path = require('path');

          // Find @qvac native packages with prebuilds
          const addonPaths = [
            'node_modules/@qvac/sdk/node_modules/@qvac/tts-onnx',
            'node_modules/@qvac/sdk/node_modules/@qvac/llm-llamacpp',
            'node_modules/@qvac/sdk/node_modules/@qvac/transcription-whispercpp'
          ];

          const allDependencies = new Set();

          for (const addonPath of addonPaths) {
            if (!fs.existsSync(addonPath)) continue;

            console.log(`\n=== ${addonPath} ===`);

            // Check prebuilds
            const prebuildPath = path.join(addonPath, 'prebuilds');
            if (fs.existsSync(prebuildPath)) {
              const platforms = fs.readdirSync(prebuildPath);
              console.log(`Platforms: ${platforms.join(', ')}`);

              // Check win32-x64
              const winPath = path.join(prebuildPath, 'win32-x64');
              if (fs.existsSync(winPath)) {
                console.log('win32-x64 contents:');
                fs.readdirSync(winPath).forEach(f => {
                  const fullPath = path.join(winPath, f);
                  const stats = fs.statSync(fullPath);
                  console.log(`  ${f} (${stats.size} bytes)`);
                });

                // Find .bare files and check dependencies
                const bareFiles = fs.readdirSync(winPath).filter(f => f.endsWith('.bare'));
                for (const bareFile of bareFiles) {
                  const fullPath = path.join(winPath, bareFile);
                  console.log(`\n--- Dependencies: ${bareFile} ---`);
                  try {
                    const result = execSync(`dumpbin /dependents "${fullPath}"`, { encoding: 'utf8', timeout: 30000 });
                    console.log(result);
                    // Parse DLL names from output
                    const dllMatches = result.match(/^\s+(\S+\.dll)/gim);
                    if (dllMatches) {
                      dllMatches.forEach(m => allDependencies.add(m.trim()));
                    }
                  } catch (err) {
                    console.log(`dumpbin not available: ${err.message}`);
                  }
                }
              } else {
                console.log('⚠️  No win32-x64 prebuild!');
              }
            }
          }

          // Check if dependencies are present on system
          if (allDependencies.size > 0) {
            console.log('\n=== Checking if dependencies exist on system ===');
            for (const dll of allDependencies) {
              try {
                const result = execSync(`where "${dll}"`, { encoding: 'utf8', timeout: 5000 });
                console.log(`✅ ${dll}: ${result.trim().split('\n')[0]}`);
              } catch (err) {
                console.log(`❌ ${dll}: NOT FOUND`);
              }
            }
          }

          // Check actual dependencies of tts-onnx.bare:
          // KERNEL32.dll, dxcore.dll, d3d12.dll, DirectML.dll, dxgi.dll, ADVAPI32.dll,
          // VCRUNTIME140.dll, VCRUNTIME140_1.dll, api-ms-win-crt-*.dll
          console.log('\n=== Checking required DLLs for tts-onnx.bare ===');
          const requiredDlls = [
            'KERNEL32.dll',
            'dxcore.dll',
            'd3d12.dll',
            'DirectML.dll',
            'dxgi.dll',
            'ADVAPI32.dll',
            'VCRUNTIME140.dll',
            'VCRUNTIME140_1.dll'
          ];
          for (const dll of requiredDlls) {
            try {
              const result = execSync(`where "${dll}"`, { encoding: 'utf8', timeout: 5000 });
              console.log(`✅ ${dll}: ${result.trim().split('\n')[0]}`);
            } catch (err) {
              console.log(`❌ ${dll}: NOT FOUND`);
            }
          }

      - name: Verify SDK works - run example (Windows)
        if: runner.os == 'Windows'
        shell: node {0}
        run: |
          const { execSync } = require('child_process');
          const fs = require('fs');

          // Check if examples directory exists
          if (!fs.existsSync('examples')) {
            console.log('⚠️  No examples directory found - skipping SDK verification');
            process.exit(0);
          }

          // Find a demo file to run
          const exampleFiles = fs.readdirSync('examples').filter(f => f.endsWith('.ts') || f.endsWith('.js'));
          if (exampleFiles.length === 0) {
            console.log('⚠️  No example files found - skipping SDK verification');
            process.exit(0);
          }

          // Prefer multi-model-demo.ts if it exists
          let targetExample = exampleFiles.find(f => f.includes('multi-model-demo')) || exampleFiles[0];
          console.log(`Running example: examples/${targetExample}`);

          try {
            execSync(`bun run examples/${targetExample}`, { stdio: 'inherit', timeout: 60000 });
            console.log('✅ SDK example ran successfully');
          } catch (err) {
            console.log('❌ SDK example failed');
            console.log(`   Exit code: ${err.status}`);
            if (err.stderr) console.log(`   Stderr: ${err.stderr.toString()}`);
            process.exit(1);
          }

      - name: Copy .npmrc to consumer directory (Windows)
        if: runner.os == 'Windows'
        shell: node {0}
        run: |
          const fs = require('fs');
          const path = require('path');
          const npmrcContent = fs.readFileSync('.npmrc', 'utf8');
          const consumerDir = '${{ inputs.working-directory }}';
          fs.writeFileSync(path.join(consumerDir, '.npmrc'), npmrcContent, 'utf8');
          console.log('✅ .npmrc copied to consumer directory');

      - name: Install dependencies - consumer (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ inputs.working-directory }}
        run: npm install --install-links

      - name: Build project - consumer (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ inputs.working-directory }}
        run: bun run build

      - name: Setup MQTT certificates
        shell: node {0}
        env:
          CA_CERT: ${{ secrets.MQTT_CA_CERT }}
          CLIENT_CERT: ${{ secrets.MQTT_CLIENT_CERT }}
          CLIENT_KEY: ${{ secrets.MQTT_CLIENT_KEY }}
        run: |
          const fs = require('fs');
          const path = require('path');
          const os = require('os');

          const certsDir = path.join(os.tmpdir(), 'mqtt-certs');
          fs.mkdirSync(certsDir, { recursive: true });

          if (process.env.CA_CERT) {
            const caPath = path.join(certsDir, 'ca.crt');
            fs.writeFileSync(caPath, process.env.CA_CERT, 'utf8');
            fs.appendFileSync(process.env.GITHUB_ENV, `MQTT_CA_PATH=${caPath}\n`, 'utf8');
          }

          if (process.env.CLIENT_CERT) {
            const certPath = path.join(certsDir, 'client.crt');
            fs.writeFileSync(certPath, process.env.CLIENT_CERT, 'utf8');
            fs.appendFileSync(process.env.GITHUB_ENV, `MQTT_CERT_PATH=${certPath}\n`, 'utf8');
          }

          if (process.env.CLIENT_KEY) {
            const keyPath = path.join(certsDir, 'client.key');
            fs.writeFileSync(keyPath, process.env.CLIENT_KEY, 'utf8');
            fs.appendFileSync(process.env.GITHUB_ENV, `MQTT_KEY_PATH=${keyPath}\n`, 'utf8');
          }

      - name: Generate runId
        id: runid
        shell: node {0}
        run: |
          const fs = require('fs');
          const platform = "${{ matrix.os }}";
          let platformShort = 'unknown';
          if (/mac/i.test(platform)) platformShort = 'macos';
          else if (/win/i.test(platform)) platformShort = 'windows';
          else if (/linux|ubuntu/i.test(platform)) platformShort = 'linux';

          const repoName = process.env.GITHUB_REPOSITORY.split('/').pop();
          const refName = process.env.GITHUB_REF_NAME.replace(/\//g, '-');
          const sha = process.env.GITHUB_SHA.substring(0, 7);
          const timestamp = Math.floor(Date.now() / 1000);
          const runId = `${repoName}-${refName}-${sha}-${timestamp}-${platformShort}`;

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `runId=${runId}\n`, 'utf8');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `platform=${platformShort}\n`, 'utf8');

      - name: Run tests (consumer + producer)
        working-directory: ${{ inputs.working-directory }}
        timeout-minutes: 15
        shell: node {0}
        run: |
          (async () => {
            const { spawn, spawnSync } = require('child_process');
            const fs = require('fs');

            const logStream = fs.createWriteStream('consumer.log', { flags: 'w' });
            const consumer = spawn('npx', [
              'qvac-test', 'run:consumer:desktop',
              '--runId=${{ steps.runid.outputs.runId }}',
              '--config=.'
            ], { detached: false, shell: true });

            let consumerClosed = false;
            let consumerExitCode = 0;

            // Pipe streams but don't auto-close logStream when child ends
            consumer.stdout.pipe(logStream, { end: false });
            consumer.stderr.pipe(logStream, { end: false });

            // Detect crash during test execution
            consumer.on('exit', (code, signal) => {
              if (code !== 0 || signal) {
                console.log(`❌ Consumer crashed (code: ${code}, signal: ${signal})`);
                console.log(`   Consumer PID: ${consumer.pid}`);
                console.log(`   Time: ${new Date().toISOString()}`);
              }
            });

            // 'close' fires after exit AND after all stdio streams are closed
            const consumerDone = new Promise(resolve => {
              consumer.on('close', (code, signal) => {
                consumerClosed = true;
                consumerExitCode = code ?? 0;
                console.log(`Consumer closed (code: ${code}, signal: ${signal})`);
                resolve();
              });
            });

            fs.writeFileSync('consumer.pid', consumer.pid.toString(), 'utf8');

            // Brief pause to let consumer initialize
            await new Promise(resolve => setTimeout(resolve, 2000));

            // Check if consumer is running
            let consumerAlive = !consumer.killed;
            try { process.kill(consumer.pid, 0); } catch (e) { consumerAlive = false; }

            if (consumerAlive) {
              console.log(`✅ Consumer running (PID: ${consumer.pid})`);
            } else {
              console.log('❌ Consumer died immediately');
              logStream.end();
              await new Promise(resolve => logStream.on('finish', resolve));
              if (fs.existsSync('consumer.log')) {
                console.log('\n--- Consumer log ---');
                console.log(fs.readFileSync('consumer.log', 'utf8'));
              } else {
                console.log('⚠️  No consumer.log file found');
              }
              process.exit(1);
            }

            // Run producer in foreground
            console.log('Starting producer...');
            const producer = spawnSync('npx', [
              'qvac-test', 'run:producer',
              '--runId=${{ steps.runid.outputs.runId }}',
              '--consumer-timeout=${{ inputs.consumer-timeout }}',
              '--config=.'
            ], { stdio: 'inherit', shell: true });

            console.log(`Producer exited with status: ${producer.status}`);
            let producerExit = producer.status || 0;

            // Wait for consumer with timeout
            console.log('Waiting for consumer to close...');
            const timeout = new Promise(resolve => setTimeout(() => {
              if (!consumerClosed) {
                console.log('⚠️  Consumer did not close within 30s timeout, killing...');
                try {
                  process.kill(consumer.pid, 'SIGTERM');
                  console.log('Sent SIGTERM to consumer');
                } catch (e) {
                  console.log(`Failed to kill consumer: ${e.message}`);
                }
              }
              resolve();
            }, 30000));

            await Promise.race([consumerDone, timeout]);

            // If timeout won, wait a bit more for close after kill
            if (!consumerClosed) {
              console.log('Waiting 5s for consumer to terminate...');
              await Promise.race([
                consumerDone,
                new Promise(resolve => setTimeout(resolve, 5000))
              ]);
            }

            // Close and flush log stream
            console.log('Closing consumer log stream...');
            logStream.end();
            await new Promise(resolve => logStream.on('finish', resolve));
            console.log('📄 Consumer log written to consumer.log');

            // Exit with producer code OR consumer code if consumer failed
            const exitCode = producerExit || consumerExitCode;
            if (exitCode !== 0) {
              console.log(`❌ Tests failed with exit code: ${exitCode}`);
              if (producerExit !== 0) console.log('   Producer failed');
              if (consumerExitCode !== 0) console.log('   Consumer failed');
            }
            process.exit(exitCode);
          })();

      - name: Stop consumer (safety)
        if: always()
        shell: node {0}
        working-directory: ${{ inputs.working-directory }}
        run: |
          const fs = require('fs');
          console.log('Checking for running consumer...');

          if (!fs.existsSync('consumer.pid')) {
            console.log('⚠️  No consumer.pid file found');
            return;
          }

          const pid = parseInt(fs.readFileSync('consumer.pid', 'utf8').trim());
          console.log(`Found consumer PID: ${pid}`);

          // Check if process is alive
          let isAlive = false;
          try {
            process.kill(pid, 0); // Signal 0 checks if process exists
            isAlive = true;
            console.log('✅ Consumer process is still running');
          } catch (e) {
            console.log('ℹ️  Consumer process already terminated');
            return;
          }

          // Try to kill it
          if (isAlive) {
            console.log('Attempting to terminate consumer...');
            try {
              process.kill(pid, 'SIGTERM');
              console.log('✅ Sent SIGTERM to consumer');
            } catch (e) {
              console.error(`❌ Failed to kill consumer process: ${e.message}`);
              console.error(`   Error code: ${e.code}`);
              console.error(`   PID: ${pid}`);
            }
          }

      - name: Upload consumer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-log-${{ steps.runid.outputs.platform }}
          path: ${{ inputs.working-directory }}/consumer.log
          retention-days: 7

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ steps.runid.outputs.platform }}-${{ github.run_number }}
          path: ${{ inputs.working-directory }}/reports/results-*.json
          retention-days: 30

      - name: Upload baseline (main/develop only)
        if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: actions/upload-artifact@v4
        with:
          name: baseline-${{ steps.runid.outputs.platform }}
          path: ${{ inputs.working-directory }}/reports/results-*.json
          retention-days: 90
          overwrite: true

      - name: Show consumer log on failure
        if: failure()
        shell: node {0}
        working-directory: ${{ inputs.working-directory }}
        run: |
          const fs = require('fs');
          if (fs.existsSync('consumer.log')) {
            console.log(fs.readFileSync('consumer.log', 'utf8'));
          }

  compare-results:
    needs: test-desktop
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ inputs.working-directory }}/dist
            ${{ inputs.working-directory }}/build
            ${{ inputs.working-directory }}/node_modules
          key: build-linux-x64-${{ github.sha }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Download current results
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: ${{ inputs.working-directory }}/current-results/
          merge-multiple: true

      - name: Download baseline results
        id: download-baseline
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: test-desktop.yml
          branch: ${{ github.event.pull_request.base.ref }}
          name: baseline-*
          path: ${{ inputs.working-directory }}/baseline-results/
          if_no_artifact_found: warn

      - name: Check baseline availability
        id: check-baseline
        shell: node {0}
        run: |
          const fs = require('fs');
          const path = require('path');
          const baselineDir = path.join('${{ inputs.working-directory }}', 'baseline-results');
          const hasBaseline = fs.existsSync(baselineDir) && fs.readdirSync(baselineDir).filter(f => f.endsWith('.json')).length > 0;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_baseline=${hasBaseline}\n`, 'utf8');

      - name: Compare results
        if: steps.check-baseline.outputs.has_baseline == 'true'
        working-directory: ${{ inputs.working-directory }}
        shell: node {0}
        run: |
          const { execSync } = require('child_process');
          const fs = require('fs');
          const platforms = ['linux', 'macos', 'windows'];

          for (const platform of platforms) {
            const currentFiles = fs.existsSync('current-results') ? fs.readdirSync('current-results').filter(f => f.includes(platform) && f.endsWith('.json')) : [];
            const baselineFiles = fs.existsSync('baseline-results') ? fs.readdirSync('baseline-results').filter(f => f.includes(platform) && f.endsWith('.json')) : [];

            if (currentFiles.length > 0 && baselineFiles.length > 0) {
              const current = `current-results/${currentFiles[0]}`;
              const baseline = `baseline-results/${baselineFiles[0]}`;
              execSync(`npx qvac-test report:compare --baseline "${baseline}" --current "${current}" --output "comparison-${platform}.json"`, { stdio: 'inherit' });
            }
          }

      - name: Format comparison
        working-directory: ${{ inputs.working-directory }}
        shell: node {0}
        run: |
          const { execSync } = require('child_process');
          const fs = require('fs');
          const path = require('path');

          let comment = '# 🧪 QVAC Test Results\n\n';
          const sha = process.env.GITHUB_SHA.substring(0, 7);
          comment += `**Branch**: \`${{ github.head_ref }}\` | **Commit**: \`${sha}\` | **Base**: \`${{ github.event.pull_request.base.ref }}\`\n\n`;

          if ("${{ steps.check-baseline.outputs.has_baseline }}" === "false") {
            comment += '⚠️ **No baseline found** - showing current results only\n\n';
            comment += '| Platform | Passed | Failed | Total | Rate | Duration |\n';
            comment += '|----------|--------|--------|-------|------|----------|\n';

            if (fs.existsSync('current-results')) {
              const results = fs.readdirSync('current-results').filter(f => f.endsWith('.json'));
              for (const result of results) {
                const json = JSON.parse(fs.readFileSync(path.join('current-results', result), 'utf8'));
                const platform = result.replace('results-', '').replace(/-.*/, '');
                comment += `| ${platform} | ${json.summary.passed} | ${json.summary.failed} | ${json.summary.total} | ${json.summary.successRate}% | ${json.summary.duration}s |\n`;
              }
            }

            comment += '\n### 📦 Artifacts\n\n';
            comment += `[View all artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)\n`;
          } else {
            const comparisons = fs.readdirSync('.').filter(f => f.startsWith('comparison-') && f.endsWith('.json'));
            for (const comparison of comparisons) {
              const platform = path.basename(comparison, '.json').replace('comparison-', '');
              execSync(`npx qvac-test report:format --input "${comparison}" --format markdown --output "platform-${platform}.md"`, { stdio: 'inherit' });

              comment += `## ${platform}\n`;
              comment += fs.readFileSync(`platform-${platform}.md`, 'utf8') + '\n';
            }

            comment += '### 📦 Artifacts\n\n';
            comment += `[View all artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)\n`;
          }

          fs.writeFileSync('comment.md', comment, 'utf8');

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const commentPath = '${{ inputs.working-directory }}/comment.md';

            if (!fs.existsSync(commentPath)) {
              console.log('No comment file generated');
              return;
            }

            const body = fs.readFileSync(commentPath, 'utf8');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
