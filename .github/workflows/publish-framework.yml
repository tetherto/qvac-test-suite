name: Build and Publish Framework

on:
  push:
    branches: ['main', 'feature/**', 'fix/**']
    paths:
      - 'framework/**'
      - '.github/workflows/publish-framework.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for publishing'
        required: false
        default: 'dev'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure scoped registry for @tetherto and @qvac packages
        env:
          GPR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GIT_PAT: ${{ secrets.PAT_TOKEN }}
        shell: bash
        run: |
          echo "Configuring scoped registry for @tetherto and @qvac packages..."
          set -eu
          echo "Writing .npmrc for dual registry install..."
          cat > .npmrc <<NPMRC
          always-auth=true
          ignore-scripts=true
          foreground-scripts=true
          registry=https://registry.npmjs.org/
          @qvac:registry=https://registry.npmjs.org/
          @tetherto:registry=https://npm.pkg.github.com/
          //registry.npmjs.org/:_authToken=${NPM_TOKEN}
          //npm.pkg.github.com/:_authToken=${GIT_PAT}
          NPMRC

          # Configure git for private deps
          if [ -n "${GIT_PAT:-}" ]; then
            git config --global url."https://${GIT_PAT}:@github.com/".insteadOf "https://github.com/"
          else
            git config --global url."https://${{ github.token }}:@github.com/".insteadOf "https://github.com/"
          fi

      - name: Install dependencies
        working-directory: framework
        run: npm install

      - name: Build
        working-directory: framework
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: framework/dist/
          retention-days: 1

      - name: Determine version and tag
        id: version
        working-directory: framework
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          BASE_VERSION=$(node -p "require('./package.json').version")

          if [ "$BRANCH_NAME" = "main" ]; then
            # Main branch: check if version already exists
            if npm view "@tetherto/qvac-test-suite@${BASE_VERSION}" version 2>/dev/null; then
              echo "Version ${BASE_VERSION} already published, skipping"
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi

            VERSION="$BASE_VERSION"
            TAG="latest"
            echo "Publishing main branch as @latest with version $VERSION"
            echo "create_git_tag=true" >> $GITHUB_OUTPUT
          else
            # Feature/fix branches: timestamped prerelease
            CLEAN_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9.-]/-/g')
            VERSION="${BASE_VERSION}-${CLEAN_BRANCH}.$(date +%s).${GITHUB_SHA:0:7}"
            TAG="$CLEAN_BRANCH"
            echo "Publishing branch '$BRANCH_NAME' as @$TAG with version $VERSION"
            echo "create_git_tag=false" >> $GITHUB_OUTPUT
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      branch: ${{ steps.version.outputs.branch }}
      skip: ${{ steps.version.outputs.skip }}
      create_git_tag: ${{ steps.version.outputs.create_git_tag }}

  publish-gpr:
    needs: build
    if: ${{ needs.build.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: framework/dist/

      - name: Update package version
        working-directory: framework
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          npm version $VERSION --no-git-tag-version --allow-same-version
          echo "Updated package.json to version: $VERSION"

      - name: Publish to GitHub Package Registry
        id: publish
        uses: tetherto/qvac-devops/.github/actions/publish-library-to-gpr@v1.1.1
        with:
          secret-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ inputs.tag || github.event.inputs.tag || needs.build.outputs.tag || 'feature' }}

      - name: Create Git Tag (main branch only)
        if: ${{ needs.build.outputs.branch == 'main' && needs.build.outputs.create_git_tag == 'true' }}
        working-directory: framework
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          echo "Created and pushed git tag: v${VERSION}"
