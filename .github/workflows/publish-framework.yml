name: Build and Publish Framework

# Publishing runs ONLY from trusted refs. We intentionally do NOT use
# `pull_request_target`: that trigger runs with the base repo's write-capable
# token/secrets while it is able to check out untrusted PR-head code, which — on
# a public repo — lets any fork PR exfiltrate them. Fork PRs are validated by
# framework-checks.yml instead (plain `pull_request`, read-only, no secrets).
# Build/publish here only ever sees code from branches that live in this repo
# (push) or an explicit maintainer-triggered run (workflow_dispatch), and it
# authenticates only with the automatic GITHUB_TOKEN.
on:
  push:
    branches: ['main', 'feature/**', 'fix/**']
    paths:
      - 'framework/**'
      - '.github/workflows/publish-framework.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for publishing'
        required: false
        default: 'dev'

jobs:
  build:
    runs-on: ubuntu-latest
    # Build only reads source and uploads an artifact; it never pushes.
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: '22'

      # framework has no @tetherto/@qvac dependencies — every dependency is
      # public — so no scoped registry or PAT/NPM_TOKEN auth is needed here.
      # --ignore-scripts: the build never needs dependency lifecycle scripts
      # (esbuild ships prebuilt binaries via optionalDependencies), so disable
      # them to avoid running arbitrary code from a dependency in CI.
      - name: Install dependencies
        working-directory: framework
        run: npm install --ignore-scripts --no-fund --no-audit

      - name: Build
        working-directory: framework
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: framework/dist/
          retention-days: 1

      - name: Check if version already published (main only)
        id: check
        if: github.ref == 'refs/heads/main'
        working-directory: framework
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          if npm view "@tetherto/qvac-test-suite@${BASE_VERSION}" version 2>/dev/null; then
            echo "Version ${BASE_VERSION} already published, skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

    outputs:
      skip: ${{ steps.check.outputs.skip }}

  publish-gpr:
    needs: build
    if: ${{ needs.build.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        # Self-checkout only. The token persists credentials for the vendored
        # action's `git push` of the release tag; GITHUB_TOKEN + contents:write
        # can push tags to this repo (tag refs aren't covered by the main
        # ruleset). PAT_TOKEN is no longer used here (it has been invalidated).
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.sha }}

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: framework/dist/

      - name: Publish to GitHub Package Registry
        # Vendored copy of tetherto/qvac-devops publish-library-to-gpr@v1.1.1.
        # A public repo cannot resolve a composite action that lives in a private
        # repo, so the action is checked in locally under .github/actions/.
        uses: ./.github/actions/publish-library-to-gpr
        with:
          secret-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.inputs.tag || '' }}
          path: framework
