name: Build and Publish Framework

# Publishing runs ONLY from trusted refs. We intentionally do NOT use
# `pull_request_target`: that trigger runs with the base repo's write-capable
# token/secrets while it is able to check out untrusted PR-head code, which — on
# a public repo — lets any fork PR exfiltrate them. Fork PRs are validated by
# framework-checks.yml instead (plain `pull_request`, read-only, no secrets).
# Build/publish here only ever sees code from branches that live in this repo
# (push) or an explicit maintainer-triggered run (workflow_dispatch). It uses no
# long-lived publish secrets: GPR auth is the automatic GITHUB_TOKEN, and the
# public npm release authenticates via short-lived OIDC (Trusted Publishing).
on:
  push:
    # main/feature/**/fix/** feed the GPR (@tetherto) flow; release-* feeds the
    # public npm (@qvac) flow (see publish-npm below), mirroring the monorepo's
    # release-branch publishing model.
    branches: ['main', 'feature/**', 'fix/**', 'release-*']
    paths:
      - 'framework/**'
      - '.github/workflows/publish-framework.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for publishing'
        required: false
        default: 'dev'

jobs:
  build:
    runs-on: ubuntu-latest
    # Build only reads source and uploads an artifact; it never pushes.
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: '22'

      # framework has no @tetherto/@qvac dependencies — every dependency is
      # public — so no scoped registry or PAT/NPM_TOKEN auth is needed here.
      # --ignore-scripts: the build never needs dependency lifecycle scripts
      # (esbuild ships prebuilt binaries via optionalDependencies), so disable
      # them to avoid running arbitrary code from a dependency in CI.
      - name: Install dependencies
        working-directory: framework
        run: npm install --ignore-scripts --no-fund --no-audit

      - name: Build
        working-directory: framework
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: framework/dist/
          retention-days: 1

      - name: Check if version already published (main only)
        id: check
        if: github.ref == 'refs/heads/main'
        working-directory: framework
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # @tetherto packages live on GPR, so the `npm view` lookup must query
          # GPR (not the public default registry) or it always reports "not
          # found" and we try to republish an existing version. GITHUB_TOKEN can
          # read this repo's own package. Scope only @tetherto to GPR so the
          # public default registry is untouched.
          cat > .npmrc <<'NPMRC'
          @tetherto:registry=https://npm.pkg.github.com/
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          NPMRC
          BASE_VERSION=$(node -p "require('./package.json').version")
          if npm view "@tetherto/qvac-test-suite@${BASE_VERSION}" version 2>/dev/null; then
            echo "Version ${BASE_VERSION} already published, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

    outputs:
      skip: ${{ steps.check.outputs.skip }}

  publish-gpr:
    needs: build
    if: ${{ needs.build.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        # Self-checkout only. The token persists credentials for the vendored
        # action's `git push` of the release tag; GITHUB_TOKEN + contents:write
        # can push tags to this repo (tag refs aren't covered by the main
        # ruleset). PAT_TOKEN is no longer used here (it has been invalidated).
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.sha }}

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: framework/dist/

      - name: Publish to GitHub Package Registry
        # Vendored copy of tetherto/qvac-devops publish-library-to-gpr@v1.1.1.
        # A public repo cannot resolve a composite action that lives in a private
        # repo, so the action is checked in locally under .github/actions/.
        uses: ./.github/actions/publish-library-to-gpr
        with:
          secret-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.inputs.tag || '' }}
          path: framework

  # Public npm release via npm Trusted Publishing (OIDC) — no long-lived token.
  # Reuses the shared, PUBLIC tetherto/qvac-actions composite actions (the same
  # ones publish-sdk.yml uses in the monorepo), so publish behaviour and the
  # dist-tag policy stay in lockstep with @qvac/sdk and @qvac/inference.
  #
  # publish-library-to-npm embeds npm-publish-gate, which HARD-FAILS on any ref
  # that is not refs/heads/release-*. That is why this job (and the release-*
  # push trigger) exist: npm releases are cut from release-* branches, while the
  # GPR (@tetherto) flow above continues to run from main/feature/**/fix/**.
  #
  # Requires a Trusted Publisher on npmjs.com for @qvac/qvac-test-suite:
  #   - organization: tetherto
  #   - repository:   qvac-test-suite
  #   - workflow:     publish-framework.yml   (this file's name — must match exactly)
  #   - environment:  npm
  # framework/package.json is named @qvac/qvac-test-suite (the GPR action rewrites
  # it to @tetherto for GitHub Packages), so no scope rewrite is needed here.
  publish-npm:
    name: Publish to npm (Trusted Publishing)
    needs: build
    if: startsWith(github.ref, 'refs/heads/release-')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # REQUIRED for OIDC: lets the runner mint the id-token npm exchanges for a
      # short-lived publish credential (also drives automatic provenance).
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: framework/dist/

      # Idempotency guard: a release branch keeps receiving commits (fixes,
      # changelog, review feedback) after the first publish. Without this, each
      # such push re-runs the job and `npm publish` 403s on the already-live
      # version, leaving the branch permanently red. Mirrors the GPR path's
      # version check in the build job, but against the public npm registry.
      - name: Skip if version already on npm
        id: npmcheck
        working-directory: framework
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} already on npm; skipping publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Resolves the npm dist-tag from package.json version vs the registry
      # (new package -> 0.0.0 baseline -> "latest"; higher patch on an existing
      # minor -> "latest"; otherwise "release-<major.minor>"). The dispatch `tag`
      # input is forwarded so a `dev`/`tmp` manual run is honoured by the
      # publish gate (graceful skip) instead of silently publishing to public npm.
      - name: Determine dist-tag
        id: dist-tag
        if: steps.npmcheck.outputs.exists != 'true'
        uses: tetherto/qvac-actions/npm-dist-tag-determination@38693d9315c5fb6bba1354d8d1ef9823bf6c10a3 # 0.1.0
        with:
          workdir: framework
          tag: ${{ github.event.inputs.tag || '' }}

      - name: Publish to npm
        if: steps.npmcheck.outputs.exists != 'true'
        uses: tetherto/qvac-actions/publish-library-to-npm@38693d9315c5fb6bba1354d8d1ef9823bf6c10a3 # 0.1.0
        with:
          tag: ${{ steps.dist-tag.outputs.tag }}
          workdir: framework
