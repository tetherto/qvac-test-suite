name: Build and Publish Framework

on:
  push:
    branches: ['main', 'feature/**', 'fix/**']
    paths:
      - 'framework/**'
      - '.github/workflows/publish-framework.yml'
  pull_request_target:
    branches: ['main']
    paths:
      - 'framework/**'
      - '.github/workflows/publish-framework.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for publishing'
        required: false
        default: 'dev'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure scoped registry for @tetherto and @qvac packages
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GIT_PAT: ${{ secrets.PAT_TOKEN }}
        shell: bash
        run: |
          echo "Configuring scoped registry for @tetherto and @qvac packages..."
          set -eu
          echo "Writing .npmrc for dual registry install..."
          cat > .npmrc << 'EOF'
          always-auth=true
          ignore-scripts=true
          foreground-scripts=true
          registry=https://registry.npmjs.org/
          @qvac:registry=https://registry.npmjs.org/
          @tetherto:registry=https://npm.pkg.github.com/
          //registry.npmjs.org/:_authToken=${NPM_TOKEN}
          //npm.pkg.github.com/:_authToken=${GIT_PAT}
          EOF

          # Configure git for private deps
          if [ -n "${GIT_PAT:-}" ]; then
            git config --global url."https://${GIT_PAT}:@github.com/".insteadOf "https://github.com/"
          else
            git config --global url."https://${{ github.token }}:@github.com/".insteadOf "https://github.com/"
          fi

      - name: Install dependencies
        working-directory: framework
        run: npm install

      - name: Build
        working-directory: framework
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: framework/dist/
          retention-days: 1

      - name: Check if version already published (main only)
        id: check
        if: github.ref == 'refs/heads/main'
        working-directory: framework
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          if npm view "@tetherto/qvac-test-suite@${BASE_VERSION}" version 2>/dev/null; then
            echo "Version ${BASE_VERSION} already published, skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

    outputs:
      skip: ${{ steps.check.outputs.skip }}

  publish-gpr:
    needs: build
    if: ${{ needs.build.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: framework/dist/

      - name: Publish to GitHub Package Registry
        uses: tetherto/qvac-devops/.github/actions/publish-library-to-gpr@v1.1.1
        with:
          secret-token: ${{ secrets.PAT_TOKEN }}
          tag: ${{ github.event.inputs.tag || '' }}
          path: framework
