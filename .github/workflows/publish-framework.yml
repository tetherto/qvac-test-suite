name: Build and Publish Framework

# Publishing runs ONLY from trusted refs. We intentionally do NOT use
# `pull_request_target`: that trigger runs with the base repo's secrets
# (NPM_TOKEN, PAT_TOKEN) while it is able to check out untrusted PR-head code,
# which — on a public repo — lets any fork PR exfiltrate those secrets. Fork PRs
# are validated by framework-checks.yml instead (plain `pull_request`, read-only,
# no secrets). Build/publish here only ever sees code from branches that live in
# this repo (push) or an explicit maintainer-triggered run (workflow_dispatch).
on:
  push:
    branches: ['main', 'feature/**', 'fix/**']
    paths:
      - 'framework/**'
      - '.github/workflows/publish-framework.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for publishing'
        required: false
        default: 'dev'

jobs:
  build:
    runs-on: ubuntu-latest
    # Build only reads source and uploads an artifact; it never pushes.
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: '22'

      - name: Configure scoped registry for @tetherto and @qvac packages
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GIT_PAT: ${{ secrets.PAT_TOKEN }}
        shell: bash
        run: |
          echo "Configuring scoped registry for @tetherto and @qvac packages..."
          set -eu
          echo "Writing .npmrc for dual registry install..."
          cat > .npmrc << 'EOF'
          always-auth=true
          ignore-scripts=true
          foreground-scripts=true
          registry=https://registry.npmjs.org/
          @qvac:registry=https://registry.npmjs.org/
          @tetherto:registry=https://npm.pkg.github.com/
          //registry.npmjs.org/:_authToken=${NPM_TOKEN}
          //npm.pkg.github.com/:_authToken=${GIT_PAT}
          EOF

          # Configure git for private deps
          if [ -n "${GIT_PAT:-}" ]; then
            git config --global url."https://${GIT_PAT}:@github.com/".insteadOf "https://github.com/"
          else
            git config --global url."https://${{ github.token }}:@github.com/".insteadOf "https://github.com/"
          fi

      - name: Install dependencies
        working-directory: framework
        run: npm install

      - name: Build
        working-directory: framework
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: framework/dist/
          retention-days: 1

      - name: Check if version already published (main only)
        id: check
        if: github.ref == 'refs/heads/main'
        working-directory: framework
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          if npm view "@tetherto/qvac-test-suite@${BASE_VERSION}" version 2>/dev/null; then
            echo "Version ${BASE_VERSION} already published, skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

    outputs:
      skip: ${{ steps.check.outputs.skip }}

  publish-gpr:
    needs: build
    if: ${{ needs.build.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ github.sha }}

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: framework/dist/

      - name: Publish to GitHub Package Registry
        # Vendored copy of tetherto/qvac-devops publish-library-to-gpr@v1.1.1.
        # A public repo cannot resolve a composite action that lives in a private
        # repo, so the action is checked in locally under .github/actions/.
        uses: ./.github/actions/publish-library-to-gpr
        with:
          secret-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.inputs.tag || '' }}
          path: framework
