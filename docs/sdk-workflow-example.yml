# Example workflow for SDK repository
# Copy this to your repo's .github/workflows/qvac-tests.yml

name: QVAC Tests

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  # Desktop tests - runs on GitHub runners or self-hosted
  desktop-tests:
    uses: tetherto/qvac-test-suite/.github/workflows/test-desktop.yml@main
    with:
      working-directory: 'tests'
      # GPU runners for SDK tests (requires Vulkan/Metal):
      platforms: '["ai-run-linux-gpu", "macos-latest-xlarge", "ai-run-windows-gpu"]'
      # For non-GPU workloads, use standard runners:
      # platforms: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      consumer-timeout: 60
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      MQTT_PROTOCOL: ${{ secrets.MQTT_PROTOCOL }}
      MQTT_HOST: ${{ secrets.MQTT_HOST }}
      MQTT_PORT: ${{ secrets.MQTT_PORT }}
      MQTT_USERNAME: ${{ secrets.MQTT_USERNAME }}
      MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
      # Optional: TLS certificates (store PEM content as secrets)
      MQTT_CA_CERT: ${{ secrets.MQTT_CA_CERT }}
      MQTT_CLIENT_CERT: ${{ secrets.MQTT_CLIENT_CERT }}
      MQTT_CLIENT_KEY: ${{ secrets.MQTT_CLIENT_KEY }}

  # Mobile tests - builds APK, deploys to AWS Device Farm
  mobile-tests:
    uses: tetherto/qvac-test-suite/.github/workflows/test-mobile.yml@main
    with:
      working-directory: 'tests'
      # Timeout for producer waiting for consumer connection (mobile is slower)
      consumer-timeout: 600
      # Maximum time for Device Farm session (minutes)
      device-farm-timeout: 30
      # Optional: filter specific tests
      # filter: 'transcription,embedding'
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      # MQTT - must use ws/wss protocol (React Native limitation)
      MQTT_PROTOCOL: ${{ secrets.MQTT_PROTOCOL }}
      MQTT_HOST: ${{ secrets.MQTT_HOST }}
      MQTT_PORT: ${{ secrets.MQTT_PORT }}
      MQTT_USERNAME: ${{ secrets.MQTT_USERNAME }}
      MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
      MQTT_CA_CERT: ${{ secrets.MQTT_CA_CERT }}
      # AWS Device Farm
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEVICE_FARM_PROJECT_ARN: ${{ secrets.AWS_DEVICE_FARM_PROJECT_ARN }}
      ANDROID_DEVICE_POOL_ARN: ${{ secrets.ANDROID_DEVICE_POOL_ARN }}
